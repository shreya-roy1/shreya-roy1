name: Update README trophy
on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:      # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the generated SVG
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=${{ github.repository_owner }}&theme=tokyonight&margin-w=15&margin-h=15&title=-Followers,-Stars,-Repositories'
          path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git commit -m "chore: auto-update github profile trophy" || exit 0
          git pull --rebase origin main || true
          git push
